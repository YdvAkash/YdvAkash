<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Akash Yadav — Engineering the Next Layer</title>
  <desc id="desc">A cinematic sci-fi command interface with a luminous orbital engine, technical readouts, circuit paths, and the name Akash Yadav.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030713"/><stop offset=".52" stop-color="#09182D"/><stop offset="1" stop-color="#170B32"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00E5FF" stop-opacity="0"/><stop offset=".2" stop-color="#00E5FF"/><stop offset=".76" stop-color="#8B5CF6"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#00E5FF" stop-opacity=".3"/><stop offset=".5" stop-color="#2563EB" stop-opacity=".12"/><stop offset="1" stop-color="#030713" stop-opacity="0"/></radialGradient>
    <pattern id="microgrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1D4262" stroke-opacity=".38" stroke-width=".8"/></pattern>
