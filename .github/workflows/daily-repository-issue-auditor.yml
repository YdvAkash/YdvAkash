name: Daily Repository Issue Auditor

on:
  schedule:
    # 5:05 PM Asia/Kolkata (11:35 UTC)
    - cron: "35 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-repository-issue-auditor
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Audit repositories and create actionable issues
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_AUDITOR_GH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_OWNER: YdvAkash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import requests

          GH_TOKEN = os.environ.get("GH_TOKEN", "")
          OPENAI_API_KEY = os.environ.get("OPENAI_API_KEY", "")
          OWNER = os.environ.get("GITHUB_OWNER", "YdvAkash")
          GH_API = "https://api.github.com"
          GH_HEADERS = {
              "Authorization": f"Bearer {GH_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          if not GH_TOKEN or not OPENAI_API_KEY:
              sys.exit("Missing secrets: configure REPOSITORY_AUDITOR_GH_TOKEN and OPENAI_API_KEY.")

          def gh_get(url, **kwargs):
              response = requests.get(url, headers=GH_HEADERS, timeout=30, **kwargs)
              response.raise_for_status()
              return response.json()

          def gh_post(url, payload):
              response = requests.post(url, headers=GH_HEADERS, json=payload, timeout=30)
              if response.status_code == 422:
                  print(f"GitHub rejected issue (possibly duplicate/validation): {response.text[:500]}")
                  return None
              response.raise_for_status()
              return response.json()

          def analyze_with_ai(repo, readme, tree, open_issues):
              prompt = {
                  "task": "Review this GitHub repository and identify at most ONE concrete, evidence-based improvement suitable for a GitHub issue.",
                  "rules": [
                      "Only report a problem or improvement supported by the supplied repository metadata, README, file paths, or open issues.",
                      "Prefer specific bugs, missing tests for existing behavior, security/reliability gaps, validation, error handling, or clearly incomplete documentation.",
                      "Do not invent code behavior; repository file contents beyond README are not supplied, so do not claim to have inspected implementation details.",
                      "Do not propose generic rewrites, large redesigns, speculative vulnerabilities, or cosmetic changes without clear evidence.",
                      "If no well-supported actionable finding exists, return no_issue=true.",
                      "Do not duplicate an existing open issue. Compare against the supplied open issue titles.",
                      "Return ONLY JSON with keys no_issue (boolean), title (string), body (string), labels (array of strings).",
                      "Issue body must include Summary, Evidence, Proposed change, and Acceptance criteria sections. Be concise and respectful.",
                      "Use only common labels likely to exist: bug, documentation, enhancement, tests. If labels are uncertain, return an empty array."
                  ],
                  "repository": {
                      "full_name": repo["full_name"],
                      "description": repo.get("description"),
                      "language": repo.get("language"),
                      "default_branch": repo.get("default_branch"),
                      "archived": repo.get("archived"),
                      "topics": repo.get("topics", []),
                      "readme_excerpt": readme[:10000],
                      "file_paths_sample": tree[:250],
                      "open_issue_titles": open_issues[:100]
                  }
              }
              response = requests.post(
                  "https://api.openai.com/v1/chat/completions",
                  headers={"Authorization": f"Bearer {OPENAI_API_KEY}", "Content-Type": "application/json"},
                  json={
                      "model": "gpt-4.1-mini",
                      "temperature": 0.1,
                      "response_format": {"type": "json_object"},
                      "messages": [
                          {"role": "system", "content": "You are a conservative senior software engineer doing evidence-based repository triage."},
                          {"role": "user", "content": json.dumps(prompt)}
                      ]
                  },
                  timeout=60
              )
              response.raise_for_status()
              raw = response.json()["choices"][0]["message"]["content"]
              return json.loads(raw)

          repos = []
          page = 1
          while True:
              batch = gh_get(f"{GH_API}/users/{OWNER}/repos", params={
                  "per_page": 100, "page": page, "sort": "updated", "direction": "desc", "type": "owner"
              })
              if not batch:
                  break
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          excluded = ("log-analyzer", "log_analyzer", "med-doc", "med_doc")
          eligible = [
              r for r in repos
              if not r.get("archived")
              and not any(token in r["name"].lower() for token in excluded)
              and r.get("owner", {}).get("login", "").lower() == OWNER.lower()
          ]
          print(f"Found {len(repos)} repositories; auditing {len(eligible)} after exclusions.")

          for repo in eligible:
              full_name = repo["full_name"]
              try:
                  # Avoid treating repositories with disabled issues as failures.
                  details = gh_get(f"{GH_API}/repos/{full_name}")
                  if not details.get("has_issues", True):
                      print(f"SKIP {full_name}: GitHub Issues are disabled.")
                      continue

                  open_data = gh_get(f"{GH_API}/repos/{full_name}/issues", params={"state": "open", "per_page": 100})
                  open_titles = [x.get("title", "") for x in open_data if "pull_request" not in x]

                  readme = ""
                  try:
                      rd = gh_get(f"{GH_API}/repos/{full_name}/readme")
                      import base64
                      readme = base64.b64decode(rd.get("content", "")).decode("utf-8", errors="replace")
                  except requests.HTTPError:
                      pass

                  tree_data = gh_get(f"{GH_API}/repos/{full_name}/git/trees/{repo['default_branch']}", params={"recursive": "1"})
                  tree = [x.get("path", "") for x in tree_data.get("tree", []) if x.get("type") == "blob"]
                  if not tree and not readme.strip():
                      print(f"SKIP {full_name}: no readable repository content.")
                      continue

                  finding = analyze_with_ai(repo, readme, tree, open_titles)
                  if finding.get("no_issue"):
                      print(f"NO ISSUE {full_name}: no strong evidence for a new actionable issue.")
                      continue

                  title = re.sub(r"\s+", " ", finding.get("title", "")).strip()
                  body = finding.get("body", "").strip()
                  if not title or not body:
                      print(f"SKIP {full_name}: AI response lacked a title or body.")
                      continue

                  # A second conservative duplicate guard, case-insensitive.
                  if any(title.lower() == t.lower() for t in open_titles):
                      print(f"SKIP {full_name}: matching open issue already exists: {title}")
                      continue

                  allowed_labels = {"bug", "documentation", "enhancement", "tests"}
                  labels = [x for x in finding.get("labels", []) if x in allowed_labels]
                  payload = {"title": title, "body": body}
                  if labels:
                      payload["labels"] = labels

                  created = gh_post(f"{GH_API}/repos/{full_name}/issues", payload)
                  if created:
                      print(f"CREATED {full_name}#{created['number']}: {created['html_url']}")
                  time.sleep(1)
              except Exception as exc:
                  print(f"ERROR {full_name}: {type(exc).__name__}: {exc}")
                  continue
          PY
